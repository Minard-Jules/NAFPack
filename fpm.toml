name = "NAFPack"
version = "VERSION"
license = "MIT"
author = "Jules Minard"
maintainer = "https://github.com/Minard-Jules/NAFPack/issues"
copyright = "Copyright 2023, Jules Minard"
description = "Numerical Analysis in Fortran Package"
keywords = ["NAFPack"]
homepage = "https://github.com/Minard-Jules/NAFPack"

[features]
release.flags = "-O3"
release.gfortran.flags = "-march=native -ffast-math -fimplicit-none -ffree-line-length-2000 -flto -funroll-loops"
release.preprocess.cpp.macros = ["NDEBUG"]

debug.flags = "-g -O0"
debug.gfortran.flags = "-Wall -Wextra -fcheck=bounds -Wimplicit-procedure -Werror=implicit-procedure -ffree-line-length-2000 -std=f2018-fbacktrace -fbounds-check -frange-check"
debug.preprocess.cpp.macros = ["DEBUG"]

[profiles]
debug = ["debug"]
release = ["release"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
link = ["fftw3"]

[install]
library = false

[fortran]
implicit-typing = true
implicit-external = true
source-form = "default"

[dependencies]
openmp = "*"
# blas = "*"
# lapack = "*"

[[test]]
name = "test_fft"
main = "test_Fourier_Transform_fft_complex.f90"
source-dir = "test/Fourier_Transform"

[dev-dependencies]
test-drive.git = "https://github.com/fortran-lang/test-drive"
test-drive.branch = "main"
